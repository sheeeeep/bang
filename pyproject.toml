[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bang"
version = "0.1.0"
description = "Personal AI environment initialization and skill management"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
bang = "bang:main"

[tool.setuptools]
py-modules = ["bang"]
packages = ["bang_templates", "bang_skills"]

[tool.setuptools.package-data]
bang_templates = ["*.md"]
bang_skills = ["install/*.md", "personal/*/*.md", "personal/*/agents/*.yaml"]

[tool.ruff]
target-version = "py39"

[tool.pyright]
pythonVersion = "3.9"
typeCheckingMode = "basic"
include = ["bang.py", "test_bang.py", "test_terminal.py"]
extraPaths = ["."]
